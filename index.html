'use strict';
const stages=[
 ['Les agents économiques','Le collectif District Live organise un concert de quartier. La mairie prête une salle, des habitants achètent des billets et une banque finance du matériel.','Identifiez les acteurs qui rendent l’événement possible.','Les ménages consomment et peuvent travailler. Les entreprises produisent. Les administrations fournissent notamment des services publics. Les institutions financières financent des projets. Le reste du monde désigne les agents non résidents avec lesquels on échange.','La mairie prête la salle. De quelle catégorie relève-t-elle ?',['Entreprise','Administration publique','Institution financière'],1,'Pensez à la fonction de la mairie, pas au bâtiment.','La mairie est une administration publique. Elle peut agir même si elle ne vend pas de billets.','Une banque finance le projet. Quel est son rôle ici ?',['Financer','Consommer','Organiser le concert'],0],
 ['L’échange et la contrepartie','Un habitant règle 12 € pour assister au concert de District Live.','Identifiez ce que chaque agent reçoit.','Un échange met en relation des agents. Dans une vente, le vendeur fournit un bien ou un service et reçoit un paiement.','Que reçoit l’habitant en contrepartie de son paiement ?',['Un salaire','Un prêt','Un accès au concert'],2,'Qu’est-ce que le billet lui permet de faire ?','Il achète un accès au concert, donc un service. Les 12 € vont à l’organisateur.','District Live vend une affiche. Que reçoit le vendeur ?',['L’affiche','Le paiement','Un travail salarié'],1],
 ['Le marché des biens et services','District Live paie un prestataire indépendant pour louer des enceintes.','Identifiez ce qui est vendu et sur quel marché.','Le marché des biens et services met en relation vendeurs et acheteurs. Un bien est un objet. Un service est une prestation. Un marché peut fonctionner en ligne.','Quel échange a lieu ici ?',['Une vente de service','Une embauche','Un financement'],0,'Une location permet d’utiliser le matériel sans l’acheter.','Le prestataire vend un service de location. Il ne devient pas salarié de District Live.','Un client achète une paire d’écouteurs. Quel marché ?',['Capitaux','Travail','Biens et services'],2],
 ['Le marché du travail','District Live embauche une technicienne pour le concert et lui verse un salaire.','Distinguez offre de travail et demande de travail.','La personne propose son travail. L’employeur a besoin de ce travail et verse un salaire. Une offre d’emploi publiée par une entreprise traduit une demande de travail au sens économique.','Qui offre son travail ?',['District Live','La technicienne','Les spectateurs'],1,'Qui met sa compétence à disposition ?','La technicienne fournit le travail. District Live le demande et verse le salaire.','Qui demande du travail au sens économique ?',['L’employeur','La salariée','Le public'],0],
 ['Le marché des capitaux','District Live cherche 2 000 € pour s’équiper. Un investisseur apporte des fonds contre une part de l’entreprise.','Distinguez financement et achat de matériel.','Sur les marchés de capitaux, des agents qui cherchent des fonds rencontrent des agents qui peuvent en apporter. Un apport en échange d’une participation diffère d’un prêt, qui doit être remboursé.','Quel échange relève ici du financement ?',['Le règlement des enceintes','Le salaire','L’apport de fonds contre une participation'],2,'Cherchez comment l’entreprise obtient les fonds, avant de les dépenser.','L’investisseur finance l’entreprise. L’achat des enceintes, lui, relève des biens et services.','L’investisseur apporte des fonds. Que reçoit-il dans cet exemple ?',['Une participation','Un salaire','Un billet'],0],
 ['Les flux réels et monétaires','District Live verse un salaire à la technicienne. Elle assure la sonorisation.','Classez ce qui circule et indiquez son sens.','Un flux réel correspond à un bien, un service ou du travail. Un flux monétaire correspond à de l’argent. Tracez une flèche par flux, de celui qui donne vers celui qui reçoit.','Quel est le flux réel ?',['Le salaire versé par District Live','Le travail fourni par la technicienne','Le prix du billet payé par le spectateur'],1,'Séparez la prestation et l’argent.','Le travail va de la technicienne à District Live. Le salaire circule dans l’autre sens.','Une spectatrice paie 12 €. Dans quel sens vont les 12 € ?',['District Live vers la spectatrice','Le prestataire vers District Live','La spectatrice vers District Live'],2],
 ['Le circuit économique','District Live paie la technicienne. Un ménage paie son billet. Vous devez présenter ces deux échanges.','Reliez les agents en nommant chaque flèche.','Un circuit est un schéma des relations entre des agents. Pour chaque flèche, indiquez ce qui circule et vérifiez son sens.','Quelle flèche représente le service acheté par le ménage ?',['Ménage → District Live : 12 €','District Live → ménage : accès au concert','Technicienne → ménage : salaire'],1,'Distinguez le paiement du service obtenu.','District Live fournit l’accès au concert au ménage. L’argent va en sens inverse.','Quelle flèche correspond au salaire ?',['District Live → technicienne','Technicienne → District Live','Ménage → technicienne'],0],
 ['Lire une infographie','Relevé fictif des billets vendus : vendredi 50, samedi 80, dimanche 60. Il s’agit de nombres de billets, pas de montants en euros.','Trouvez une donnée et formulez un constat précis.','Repérez le titre et l’unité. Sélectionnez la bonne ligne ou barre. Formulez une phrase avec la période et l’unité, sans inventer une cause.','Quel constat est justifié par les données ?',['Samedi : 80 billets vendus','Vendredi : 50 € encaissés','Dimanche : ventes maximales'],0,'Relisez l’unité puis comparez les trois valeurs.','Le samedi, 80 billets ont été vendus. Le nombre de billets ne donne pas directement la recette.','Combien de billets de plus samedi que vendredi ?',['20','30','130'],1]
];
const terms=[
 ['Agent économique','Personne ou organisation qui prend des décisions économiques.','Une mairie, un ménage ou une entreprise.','Une personne peut être consommatrice et salariée.',0],['Ménage','Personne seule ou ensemble des occupants d’un même logement.','Une personne seule qui achète un billet.','Un ménage ne se limite pas aux familles.',0],['Entreprise','Organisation qui produit des biens ou des services pour les vendre.','District Live vend des billets.','Une prestation peut être vendue sans être un objet.',0],['Institution financière','Agent qui fournit notamment des services financiers.','Une banque accorde un prêt.','Un prêt n’est pas un chiffre d’affaires.',4],['Administration publique','Organisation publique qui fournit notamment des services collectifs.','La mairie met une salle à disposition.','Public ne veut pas dire gratuit dans tous les cas.',0],['Reste du monde','Agents non résidents qui ont des échanges avec les agents du pays étudié.','Un fournisseur installé à l’étranger.','La nationalité seule ne permet pas de classer l’agent.',0],['Contrepartie','Ce qui est donné ou reçu en échange.','Le salaire rémunère le travail.','Regardez la relation du point de vue de chaque agent.',1],['Marché','Ensemble de relations entre offreurs et demandeurs.','Une réservation de billets en ligne.','Un marché n’a pas besoin d’un lieu physique.',2],['Marché du travail','Rencontre entre les personnes qui proposent leur travail et les employeurs.','Une technicienne est embauchée.','Une offre d’emploi correspond à une demande de travail.',3],['Marché des capitaux','Rencontre entre des agents qui cherchent des fonds et des agents qui peuvent les apporter.','Un investisseur finance une entreprise.','Acheter une enceinte ne revient pas à apporter des capitaux.',4],['Flux réel','Circulation d’un bien, d’un service ou du travail.','La technicienne assure la sonorisation.','Le travail est un flux réel même s’il est immatériel.',5],['Flux monétaire','Circulation d’argent.','Le salaire payé par l’entreprise.','Le salaire est distinct du travail fourni.',5],['Circuit économique','Schéma simplifié des flux entre agents.','Deux flèches opposées pour un achat et son règlement.','Une flèche doit avoir un sens et un libellé.',6],['Production marchande','Production vendue à un prix économiquement significatif.','Un concert proposé avec un billet payant.','La vente n’est pas réservée aux biens matériels.',2],['Production non marchande','Production fournie gratuitement ou à un prix économiquement peu significatif.','Un service municipal gratuit.','Elle mobilise tout de même des ressources.',2],['Consommation','Utilisation d’un bien ou service pour satisfaire un besoin.','Un ménage utilise un service d’écoute musicale.','Utiliser un service et le produire sont deux rôles différents.',2]];
terms.push(
 ['Échange','Opération dans laquelle des agents se donnent quelque chose en retour.','Une boulangerie fournit du pain ; un client paie.','Un don n’implique pas nécessairement de contrepartie.',1],
 ['Marché des biens et services','Rencontre entre les vendeurs et les acheteurs de biens ou de prestations.','Un client réserve une coupe de cheveux.','Le marché peut fonctionner en ligne.',2],
 ['Bien','Produit matériel qui répond à un besoin.','Un vélo acheté dans un magasin.','La réparation d’un vélo est un service.',2],
 ['Service','Prestation qui répond à un besoin.','Une course en taxi.','Un service peut être payant ou gratuit pour l’usager.',2],
 ['Salaire','Somme versée par l’employeur en rémunération du travail salarié.','Un magasin rémunère sa vendeuse.','Une facture réglée à un prestataire indépendant n’est pas un salaire.',3],
 ['Financement','Moyens obtenus ou mobilisés pour payer un projet.','Une entreprise emprunte pour acheter du matériel.','L’obtention de fonds et l’achat du matériel sont deux opérations différentes.',4],
 ['Prêt','Somme mise à disposition pour une durée donnée et qui doit être remboursée.','Une banque prête 2 000 € à une entreprise.','Un prêt ne donne pas automatiquement une part de l’entreprise.',4],
 ['Infographie','Présentation visuelle qui organise des informations ou des données.','Un graphique montre le nombre de clients par jour.','Vérifiez le titre, la période et l’unité avant de conclure.',7]
);
const lessons=[
 {body:['Un agent économique prend des décisions : acheter, produire, travailler, financer ou organiser un service public. On le classe d’abord d’après ce qu’il fait dans la situation étudiée.','Un ménage peut consommer et fournir du travail. Une entreprise produit pour vendre. Une administration publique organise notamment des services collectifs. Une institution financière fournit des services financiers. Le reste du monde regroupe les agents non résidents avec lesquels on échange.'], example:'Dans une boulangerie, une cliente achète du pain, l’entreprise le produit et une banque finance le four. La cliente agit ici comme ménage, même si elle travaille ailleurs.', q:'Une personne achète du pain pour son foyer. Quel rôle joue-t-elle dans cet échange ?', options:['Elle produit un bien.','Elle consomme comme membre d’un ménage.','Elle finance le matériel de l’entreprise.'], key:1, feedback:'Elle achète pour satisfaire un besoin de son foyer. L’entreprise, elle, produit et vend le pain.'},
 {body:['Pour décrire un échange, nommez les deux agents, puis dites ce que chacun fournit et ce qu’il reçoit. Dans une vente, le paiement est la contrepartie du bien ou du service fourni.','Ne confondez pas l’objet de la prestation et la prestation elle-même : faire réparer un vélo ne revient pas à acheter un autre vélo.'], example:'Une cliente paie 20 € à un cordonnier pour faire réparer une chaussure. Elle reçoit la réparation ; le cordonnier reçoit 20 €.', q:'Dans cet exemple, quelle contrepartie le cordonnier reçoit-il ?', options:['La chaussure réparée.','Une nouvelle chaussure.','Le paiement de 20 €.'], key:2, feedback:'Le cordonnier fournit le service de réparation et reçoit le paiement. La chaussure réparée revient à la cliente.'},
 {body:['Sur le marché des biens et services, le vendeur propose un produit ou une prestation et l’acheteur cherche à satisfaire un besoin. Le marché peut être physique ou en ligne.','Un bien est matériel. Un service est une prestation. La production est marchande si elle est vendue à un prix économiquement significatif. Elle est non marchande si elle est fournie gratuitement ou à un prix peu significatif. Produire un service gratuit pour l’usager a tout de même un coût.'], example:'Une librairie vend un livre. Une médiathèque municipale propose une lecture gratuite. Dans le premier cas, on achète un bien ; dans le second, on bénéficie d’un service non marchand.', q:'Un atelier de quartier est gratuit pour les participants, mais la mairie paie les animateurs. Comment classer cette prestation ?', options:['Non marchande : elle est gratuite pour les usagers.','Marchande : les animateurs sont payés.','Marchande : une prestation est toujours vendue.'], key:0, feedback:'La gratuité s’apprécie du point de vue de l’usager. Le coût de l’atelier ne suffit pas à en faire une vente.'},
 {body:['Sur le marché du travail, une personne offre son travail et un employeur le demande. En échange du travail salarié, l’employeur verse un salaire.','Attention au vocabulaire : quand un magasin publie une offre d’emploi, il exprime une demande de travail. Il cherche quelqu’un pour accomplir des tâches. S’il achète la prestation d’un indépendant, il achète un service au lieu de recruter un salarié.'], example:'Un cinéma recrute une personne pour l’accueil. La personne fournit son travail ; le cinéma le demande et verse le salaire.', q:'Un magasin affiche « Recherche vendeur ou vendeuse ». Qui demande du travail au sens économique ?', options:['La personne qui répond à l’annonce.','Le magasin qui souhaite recruter.','Les clients qui viennent au magasin.'], key:1, feedback:'Le magasin cherche du travail à faire réaliser. La personne qui postule propose son travail.'},
 {body:['Un agent qui cherche des fonds pour un projet a besoin d’un financement. Un investisseur peut apporter des fonds contre une participation dans une entreprise. Un prêt doit être remboursé selon les conditions convenues.','Pour classer une situation, séparez l’obtention des fonds de leur utilisation. Emprunter ou lever des fonds relève du financement ; acheter ensuite un équipement relève du marché des biens et services.'], example:'Une entreprise emprunte pour équiper sa boutique. Elle reçoit d’abord l’argent de la banque, puis paie un fournisseur pour obtenir du matériel.', q:'Laquelle de ces opérations permet à l’entreprise d’obtenir des fonds ?', options:['Régler la facture du fournisseur.','Rembourser une échéance à la banque.','Recevoir le montant du prêt bancaire.'], key:2, feedback:'Recevoir le prêt apporte les fonds à l’entreprise. Payer un fournisseur ou rembourser la banque fait sortir de l’argent.'},
 {body:['Un flux indique ce qui circule et dans quel sens. Un flux réel correspond à un bien, à un service ou à du travail ; un flux monétaire correspond à de l’argent.','Pour tracer une flèche, commencez par celui qui fournit ou verse, et terminez par celui qui reçoit. Dans une vente simple, le produit ou la prestation et le paiement circulent dans des sens opposés.'], example:'Une famille paie 30 € à un réparateur pour remettre un vélo en état.', flow:['Réparateur → famille : réparation (flux réel).','Famille → réparateur : paiement de 30 € (flux monétaire).'], q:'Une famille règle une course en taxi. Quel est le sens du flux réel ?', options:['Taxi → famille : la course.','Famille → taxi : le paiement.','Famille → taxi : la course.'], key:0, feedback:'Le taxi fournit le transport à la famille. Le paiement, lui, circule de la famille vers le taxi.'},
 {body:['Un circuit économique relie plusieurs agents. Placez d’abord les agents, puis tracez une flèche par flux et écrivez ce qu’elle représente.','Un même ménage peut acheter et travailler. Une même entreprise peut vendre et embaucher. Gardez une flèche et un libellé différents pour chaque opération, même entre les mêmes agents.'], example:'Un ménage achète du pain à une boulangerie. Un membre du ménage travaille aussi dans la boulangerie.', flow:['Boulangerie → ménage : pain ; ménage → boulangerie : paiement du pain.','Ménage → boulangerie : travail ; boulangerie → ménage : salaire.'], q:'Dans ce circuit, quelle flèche représente le travail fourni ?', options:['Boulangerie → ménage : travail.','Ménage → boulangerie : travail.','Ménage → boulangerie : salaire.'], key:1, feedback:'La personne fournit son travail à la boulangerie. La boulangerie lui verse le salaire dans le sens opposé.'},
 {body:['Pour lire une infographie, repérez le titre, la période et l’unité. Relevez les valeurs utiles avant de les comparer.','Formulez ensuite un constat précis avec l’unité. Un graphique peut montrer une hausse de fréquentation sans en expliquer la cause ni indiquer les recettes.'], example:'Un musée compte 40 visites mardi et 55 mercredi. Le mercredi, il y a eu 15 visites de plus, car 55 − 40 = 15.', q:'Avec ces deux données, quelle phrase est justifiée ?', options:['Le musée a gagné 15 € de plus mercredi.','Les visites ont augmenté grâce à une publicité.','Le musée a accueilli 15 visites de plus mercredi.'], key:2, feedback:'L’unité est la visite. Les données permettent de comparer les visites, mais ne donnent ni la recette ni la cause de la variation.'}
];

 ['Festival de Cannes','Relevez deux acteurs cités dans le document. Pour chacun, indiquez sa catégorie et ce qu’il apporte à l’événement.'],
 ['Deezer','À partir du document, identifiez le service, l’agent qui le propose et l’agent qui le demande. Nommez le marché et justifiez.'],

function start(k,name='',g='',resume=false){kind=k;id=name;group=g;state=blank();if(k==='student'){try{state={...state,...JSON.parse(get('data:'+g+':'+name)||'{}')}}catch{} const now=new Date().toISOString();state.connections++;state.dates.push(now);state.first=state.first||now;state.lastConnection=now;put('profile',JSON.stringify({id,group}));save();}else{try{localStorage.removeItem(P+'profile')}catch{}}document.body.classList.toggle('collectif',k==='collective');show(resume&&['path','course','lex','dm','review','activity'].includes(state.screen)?state.screen:'course')}
function show(s,focus=true){screen=s;if(s!=='home'){state.screen=s;save()}document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.go===(s==='activity'?'path':s))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});render();highlight(view);if(focus){window.scrollTo(0,0);view.querySelector('h1,h2')?.focus({preventScroll:true})}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const head=(k,t)=>'<p class="eyebrow">'+k+'</p><h2 tabindex="-1">'+t+'</h2>';
const btn=(label,attr,cls='')=>'<button type="button" class="'+cls+'" '+attr+'>'+label+'</button>';
function openStage(i){state.last=i;show('activity')}
function pick(question,choices,key,selected){return '<fieldset><legend><b>'+question+'</b></legend>'+choices.map((v,j)=>'<label><input type="radio" name="'+key+'" value="'+j+'" '+(selected===j?'checked':'')+'> '+v+'</label>').join('')+'</fieldset>'}
const glossaryForms={
 'Agent économique':['agents économiques'], 'Ménage':['ménages'], 'Entreprise':['entreprises'], 'Institution financière':['institutions financières'],
 'Administration publique':['administrations publiques'], 'Contrepartie':['contreparties'], 'Marché':['marchés'],
 'Marché des biens et services':['marchés des biens et services','marché des biens et des services','marchés des biens et des services'],
 'Marché du travail':['marchés du travail'], 'Marché des capitaux':['marchés des capitaux'],
 'Flux réel':['flux réels'], 'Flux monétaire':['flux monétaires','flux financier','flux financiers'],
 'Circuit économique':['circuits économiques'], 'Production marchande':['productions marchandes'],
 'Production non marchande':['productions non marchandes'], 'Échange':['échanges'], 'Bien':['biens'], 'Service':['services'],
 'Salaire':['salaires'], 'Financement':['financements'], 'Prêt':['prêts'], 'Infographie':['infographies']
};
const glossaryIndex=new Map();
const normalTerm=t=>t.toLocaleLowerCase('fr').replace(/\s+/g,' ');
terms.forEach((t,i)=>[t[0],...(glossaryForms[t[0]]||[])].forEach(s=>glossaryIndex.set(normalTerm(s),i)));
const glossaryPattern=new RegExp('(?<![\\p{L}\\p{M}])(?:'+[...glossaryIndex.keys()].sort((a,b)=>b.length-a.length).map(s=>s.replace(/ /g,'\\s+')).join('|')+')(?![\\p{L}\\p{M}])','giu');
function highlight(root){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), list=[];
 for(let node=walker.nextNode();node;node=walker.nextNode())if(!node.parentElement?.closest('button,a,textarea,select,option,[data-gloss],.eyebrow')&&!(screen==='lex'&&node.parentElement?.closest('summary')))list.push(node);
 for(const node of list){
  const raw=node.textContent;const hits=[...raw.matchAll(glossaryPattern)].filter(m=>!(normalTerm(m[0])==='bien'&&/(?:faire|bien|pas)\s*$/iu.test(raw.slice(0,m.index))));
  if(!hits.length)continue;
  const frag=document.createDocumentFragment();let end=0;
  for(const m of hits){
   frag.append(raw.slice(end,m.index));
   const nested=node.parentElement.closest('label,summary');const b=document.createElement(nested?'span':'button');
   if(nested){b.setAttribute('role','button');b.tabIndex=0;}else b.type='button';
   b.className='gloss';b.dataset.gloss=glossaryIndex.get(normalTerm(m[0]));b.setAttribute('aria-haspopup','dialog');b.textContent=m[0];frag.append(b);end=m.index+m[0].length;
  }
  frag.append(raw.slice(end));node.replaceWith(frag);
 }
}
const gd=$('#gloss-dialog');let glossSource=null;
function openGloss(target){const t=terms[Number(target.dataset.gloss)];if(!t)return;glossSource=target;$('#gloss-title').textContent=t[0];$('#gloss-definition').textContent=t[1];$('#gloss-example').textContent=t[2];$('#gloss-tip').textContent=t[3];gd.showModal()}
view.addEventListener('click',e=>{const b=e.target.closest('[data-gloss]');if(b){e.preventDefault();e.stopPropagation();openGloss(b)}});
view.addEventListener('keydown',e=>{const b=e.target.closest('span[data-gloss]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();openGloss(b)}});
$('#gloss-close').addEventListener('click',()=>gd.close());
gd.addEventListener('click',e=>{if(e.target===gd){const r=gd.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)gd.close()}else if(e.target.closest('[data-go]'))gd.close()});
gd.addEventListener('close',()=>{if(glossSource?.isConnected)glossSource.focus({preventScroll:true});glossSource=null});
new MutationObserver(records=>{if(records.some(r=>r.target.closest('.feedback')))highlight(view)}).observe(view,{childList:true,subtree:true});
function openLesson(i,move=true){
 if(screen!=='course')show('course');

 d.open=true;

}
function courseStatus(){const n=Object.keys(state.courseDone).length;return n+' / '+lessons.length+' notions validées'}
function lessonCard(l,i){

 return '<details class="course-step" id="lesson'+i+'"><summary>'+ (i+1)+'. '+stages[i][0]+' <span class="status" data-course-status="'+i+'">'+(complete?'Validée':'À valider')+'</span></summary>'+
 l.body.map(p=>'<p>'+p+'</p>').join('')+'<div class="flow"><strong>Exemple guidé</strong><p>'+l.example+'</p>'+(l.flow?'<ul class="diagram">'+l.flow.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'')+'</div>'+
 '<form data-course-question="'+i+'"><h3>Vérifiez votre compréhension</h3>'+pick(l.q,l.options,'course'+i,answer)+'<button class="primary">Vérifier ma réponse</button><div class="feedback" role="status">'+(complete?'<b>Notion validée.</b> '+l.feedback:'')+'</div></form>'+
 '<div class="row">'+(i+1<lessons.length?btn('Notion suivante','data-lesson="'+(i+1)+'"','secondary'):btn('Passer au parcours','data-go="path"','secondary'))+'</div></details>';
}
function render(){const n=Object.keys(state.done).length;notice.textContent=kind==='student'?'Groupe '+group+' · '+n+'/'+total+' étapes validées'+(storage?' · sauvegarde sur cet appareil':' · sauvegarde indisponible'):kind==='collective'?'A. Zeboudj · Mode collectif · aucune donnée élève enregistrée':'';
  if(screen==='home'){view.innerHTML='<div class="hero"><p class="eyebrow">Économie-Droit · Seconde professionnelle</p><h1 tabindex="-1">Chapitre 2 : Les échanges entre les agents</h1><p><strong>Qui échange quoi, avec qui ?</strong></p><p>Commencez par le cours et ses questions de compréhension. Puis appliquez les notions dans la mission District Live.</p><div class="row"><span class="chip" style="color:#16273e">3 marchés</span><span class="chip" style="color:#16273e">2 types de flux</span></div>'+btn('Commencer le cours','data-go="course"','primary')+'</div><div class="grid"><article>'+head('Projection','En classe')+'<p>Avancez ensemble, sans enregistrer de résultats individuels.</p>'+btn('A. Zeboudj • Mode collectif','id="collective"','primary')+'</article><article>'+head('Travail individuel','À la maison')+'<p>Choisissez votre groupe. Aucun code d’accès n’est nécessaire.</p><form id="login"><label for="group">Votre groupe</label><select id="group" required><option value="">Choisissez votre groupe</option><option value="1">Groupe 1</option><option value="2">Groupe 2</option></select><p><small>La progression reste dans ce navigateur. Aucun envoi automatique.</small></p><button class="primary">Commencer ou reprendre</button></form></article></div>';return}
 if(screen==='path'){view.innerHTML='<article>'+head('2. Appliquer','Le parcours')+'<p>'+n+' étapes validées sur '+total+' <span class="chip">'+Math.round(n/total*100)+' %</span></p><progress aria-label="Étapes validées" value="'+n+'" max="'+total+'"></progress><p>Après le cours, réutilisez les notions dans les situations de District Live. Une fiche vous manque ? '+btn('Revenir au cours','data-go="course"','secondary')+'</p><p>En classe : étapes 1 à 7. À la maison : reprenez ces étapes, puis travaillez l’infographie et le manuel.</p><div class="row">'+btn('Reprendre l’étape','data-step="'+state.last+'"','primary')+'</div></article><article class="list">'+stages.map((a,i)=>'<div class="path-item"><strong>'+(i+1)+'. '+a[0]+'</strong>'+btn(state.done[i]?'Revoir l’activité '+(i+1):'Faire l’activité '+(i+1),'data-step="'+i+'"','secondary')+'</div>').join('')+'</article>';return}
 if(screen==='course'){view.innerHTML='<article>'+head('1. Comprendre','Cours théorique')+'<p>Lisez les notions dans l’ordre, puis répondez à la question de chaque fiche. Les mots surlignés ouvrent leur définition.</p><p id="course-status" role="status">'+courseStatus()+'</p><div class="row">'+btn('Passer au parcours','data-go="path"','secondary')+'</div></article><article>'+lessons.map(lessonCard).join('')+'</article>';const next=lessons.findIndex((_,i)=>!state.courseDone[i]);openLesson(next<0?0:next,false);return}
 if(screen==='lex'){view.innerHTML='<article>'+head('Définition · exemple · vigilance','Lexique')+terms.map(t=>'<details><summary>'+t[0]+'</summary><p>'+t[1]+'</p><p><b>Exemple :</b> '+t[2]+'</p><p><b>À retenir :</b> '+t[3]+'</p>'+btn('Voir le cours','data-lesson="'+t[4]+'"','secondary')+'</details>').join('')+'</article>';return}
 if(screen==='activity'){const i=state.last,a=stages[i];const extra=i===6?'<details><summary>Atelier : construisez le circuit</summary><p>Sur papier, placez District Live, le ménage et la technicienne. Tracez quatre flèches et nommez chaque flux.</p><details><summary>Vérifier les quatre flèches</summary><p>District Live → ménage : accès au concert. Ménage → District Live : prix du billet. Technicienne → District Live : travail. District Live → technicienne : salaire.</p></details></details>':i===7?'<figure aria-label="Billets vendus : vendredi 50, samedi 80, dimanche 60"><figcaption>Billets vendus par jour</figcaption>'+[['Vendredi',50],['Samedi',80],['Dimanche',60]].map(x=>'<div>'+x[0]+' <meter min="0" max="100" value="'+x[1]+'"></meter> '+x[1]+'</div>').join('')+'</figure>':'';view.innerHTML='<article class="step">'+head('Étape '+(i+1)+' sur '+total,a[0])+'<p>'+a[1]+'</p><p><b>Mission :</b> '+a[2]+'</p>'+extra+'<form id="activity">'+pick(a[4],a[5],'answer',state.answers[i])+'<button class="primary">Vérifier</button></form><div class="feedback" id="feedback" role="status">'+(state.done[i]?'<b>Correction :</b> '+a[8]:'')+'</div><div class="row">'+btn('Voir la correction','id="solution" '+(!state.done[i]&&(state.attempts[i]||0)<2?'hidden':''))+btn('Fiche de cours','data-lesson="'+i+'"','secondary')+(i>0?btn('Précédent','data-step="'+(i-1)+'"'):'')+(i<total-1?btn('Suivant','data-step="'+(i+1)+'"'):btn('Devoir maison','data-go="dm"'))+'</div></article>';return}
 if(screen==='dm'){view.innerHTML='<article>'+head('Mission à la maison','Le dossier du manuel')+'<p>Ouvrez votre manuel au chapitre 2, pages 15 à 22. Recherchez les documents par leur titre. Répondez avec vos mots, en une à trois phrases. Les photos ne sont pas reproduites ici.</p><p><b>Avant le 19 novembre :</b> reprenez les étapes 1 à 7 et traitez les missions 1 et 2.</p><p><b>Du 19 au 25 novembre :</b> terminez les missions 3 à 5, puis faites l’entraînement DST.</p></article>'+dm.map((d,i)=>'<article><h3>'+ (i+1)+'. '+d[0]+'</h3><label for="dm'+i+'">'+d[1]+'</label><textarea id="dm'+i+'" data-draft="'+i+'" rows="3" maxlength="1200">'+esc(state.draft[i])+'</textarea></article>').join('')+'<article><p><b>Avant de rendre :</b> relisez et vérifiez vos preuves dans le manuel. Télécharger ne transmet rien.</p>'+btn('Télécharger mon devoir','id="download"','primary')+(validationUrl&&kind==='student'?'<p><a href="'+esc(validationUrl)+'" target="_blank" rel="noopener">Ouvrir le formulaire de rendu</a></p>':'<p>Remettez votre devoir selon la consigne donnée en classe.</p>')+'</article>';return}
 if(screen==='review'){view.innerHTML='<article>'+head('Jeudi 26 novembre · 45 min','Préparation au devoir sur table')+'<p>À maîtriser : identifier les agents et les échanges, repérer le marché, distinguer et orienter les flux, lire un circuit simple. L’infographie est un entraînement complémentaire.</p><h3>Les quiz du chapitre</h3><p>Après l’envoi, cliquez sur « Afficher le score » pour consulter votre note et le corrigé.</p><ul><li><a href="https://docs.google.com/forms/d/e/1FAIpQLScHzxae5MXi1YsPKwJpyHVZzZfW533VoGiV69S5ZPIIoVaOSw/viewform" target="_blank" rel="noopener noreferrer">Quiz A : Identifier les échanges</a></li><li><a href="https://docs.google.com/forms/d/e/1FAIpQLSccnfXeOqTUioOTi2OkAK7OjQPlGGK2MM6bL5neRO9VA-fX0Q/viewform" target="_blank" rel="noopener noreferrer">Quiz B : Appliquer le circuit économique</a></li></ul><details><summary>La méthode avant de rendre</summary><p>Renseignez votre prénom, votre nom, la date et votre groupe. Faites le tour du dossier et de ses annexes. Repérez la consigne et les données utiles. Répondez en justifiant. Relisez et vérifiez la présentation.</p></details></article>'+stages.slice(0,7).map((a,i)=>'<article><form data-review="'+i+'">'+pick(a[9],a[10],'review'+i,state.review[i]?.choice)+'<button class="primary">Vérifier</button><div class="feedback" role="status">'+(state.review[i]?.correct?'Réponse juste.':'')+'</div></form></article>').join('');return}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)show(b.dataset.go);if(b.dataset.step!==undefined)openStage(Number(b.dataset.step));if(b.dataset.lesson!==undefined)openLesson(Number(b.dataset.lesson));if(b.id==='collective')start('collective');if(b.id==='solution')$('#feedback').innerHTML='<b>Correction expliquée :</b> '+stages[state.last][8];if(b.id==='download'){if(kind!=='student'){notice.textContent='Démarrez une session individuelle avant de télécharger votre devoir.';return}const data=['ÉcoCity | Devoir maison | Groupe '+group,'Étapes validées : '+Object.keys(state.done).length+'/'+total,...dm.map((d,i)=>(i+1)+'. '+d[0]+'\n'+(state.draft[i]?.trim()||'[Sans réponse]'))].join('\n\n');const url=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='EcoCity_DM_G'+group+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.dataset.courseQuestion!==undefined){const i=Number(f.dataset.courseQuestion),l=lessons[i],x=new FormData(f).get('course'+i),box=f.querySelector('.feedback');if(x===null){box.textContent='Choisissez une réponse.';return}const ok=Number(x)===l.key;if(ok||!state.courseDone[i])state.courseAnswers[i]=Number(x);if(ok)state.courseDone[i]=true;box.innerHTML=(ok?'<b>Notion validée.</b> ':'<b>À revoir.</b> ')+l.feedback;const status=$('[data-course-status="'+i+'"]');status.textContent=state.courseDone[i]?'Validée':'À valider';$('#course-status').textContent=courseStatus();save();return}if(f.id==='login'){const g=$('#group').value; if(!['1','2'].includes(g))return; let prior=null;try{prior=JSON.parse(get('profile'));}catch{}const localId=prior?.group===g&&/^[A-Z0-9]{3,16}$/.test(prior.id)?prior.id:'LOCAL';start('student',localId,g,true);return}if(f.id==='activity'){const i=state.last,a=stages[i],x=new FormData(f).get('answer'),box=$('#feedback');if(x===null){box.textContent='Choisissez une réponse.';return}state.answers[i]=Number(x);state.attempts[i]=(state.attempts[i]||0)+1;if(Number(x)===a[6]){state.done[i]=true;box.innerHTML='<b>Étape validée.</b> '+a[8]}else box.innerHTML='<b>À revoir.</b> '+a[7];save();$('#solution').hidden=!state.done[i]&&state.attempts[i]<2;const n=Object.keys(state.done).length;if(kind==='student')notice.textContent='Groupe '+group+' · '+n+'/'+total+' étapes validées'+(storage?' · sauvegarde sur cet appareil':' · sauvegarde indisponible');return}if(f.dataset.review!==undefined){const i=Number(f.dataset.review),a=stages[i],x=new FormData(f).get('review'+i),box=f.querySelector('.feedback');if(x===null){box.textContent='Choisissez une réponse.';return}const correct=Number(x)===a[11];state.review[i]={choice:Number(x),correct};save();box.textContent=correct?'Réponse juste : '+a[10][a[11]]+'.':'Pas encore. Relisez la fiche « '+a[0]+' », puis réessayez.'}});
document.addEventListener('input',e=>{if(e.target.dataset.draft!==undefined){state.draft[e.target.dataset.draft]=e.target.value;save()}});
